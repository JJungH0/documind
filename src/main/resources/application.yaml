spring:
  application:
    name: documind

  datasource:
    url: jdbc:postgresql://localhost:5433/documind
    username: documind
    password: documind
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-init-sql: SET hnsw.iterative_scan = strict_order

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 50
        order_inserts: true
        generate_statistics: true
    open-in-view: false

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        model: gpt-4o-mini
      embedding:
        model: text-embedding-3-small

logging:
  level:
    org.hibernate.sql: debug
    org.hibernate.session.metrics: debug

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: health, info, metrics

documind:
  storage:
    location: ./storage/documents
  embedding:
    batch-size: 100
    concurrency: 4
    worker-count: 2
    queue-capacity: 20
    retry-max-attempts: 4
    retry-initial-wait: 10s
    retry-max-wait: 40s
  rag:
    candidate-count: 20
    context-char-limit: 2000
    min-similarity: 0.25
  pricing:
    # OpenAI 공식 모델 기준 (2026-10-06 확인), 100만 토큰당 USD
    # https://developers.openai.com/api/docs/pricing
    chat-input-per-million: 0.15
    chat-output-per-million: 0.60
    embedding-per-million: 0.02
    zone: Asia/Seoul

